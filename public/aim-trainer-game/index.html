<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .stat {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        #startScreen, #endScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .target {
            position: absolute;
            border-radius: 50%;
            cursor: crosshair;
            transition: all 0.1s ease;
            background: radial-gradient(circle, #ff6b6b, #ee5a24);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .target:hover {
            transform: scale(1.1);
        }

        .hit-effect {
            position: absolute;
            pointer-events: none;
            color: #4ecdc4;
            font-weight: bold;
            font-size: 20px;
            animation: hitEffect 0.5s ease-out forwards;
        }

        @keyframes hitEffect {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(1.5) translateY(-30px);
            }
        }

        .miss-effect {
            position: absolute;
            pointer-events: none;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 16px;
            animation: missEffect 0.5s ease-out forwards;
        }

        @keyframes missEffect {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(1.2) translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>

        <div id="ui">
            <div class="stat"><span data-i18n="score">Score</span>: <span id="score">0</span></div>
            <div class="stat"><span data-i18n="accuracy">Accuracy</span>: <span id="accuracy">100%</span></div>
            <div class="stat"><span data-i18n="time">Time</span>: <span id="timer">30</span><span data-i18n="seconds">s</span></div>
            <div class="stat"><span data-i18n="combo">Combo</span>: <span id="combo">0</span></div>
        </div>

        <div id="startScreen">
            <h1 style="font-size: 48px; margin-bottom: 20px;" data-i18n="startTitle">🎯 Aim Trainer</h1>
            <p style="font-size: 20px; margin-bottom: 30px; text-align: center;">
                <span data-i18n="startDescription">Click on the targets that appear to improve your accuracy!</span><br>
                <span data-i18n="startDescription2">You have 30 seconds to get the best possible score.</span>
            </p>
            <button onclick="startGame()" data-i18n="startButton">Start</button>
        </div>

        <div id="endScreen" style="display: none;">
            <h1 style="font-size: 48px; margin-bottom: 20px;" data-i18n="endTitle">🏆 Finished!</h1>
            <div style="text-align: center; margin-bottom: 30px;">
                <p style="font-size: 24px; margin: 10px 0;"><span data-i18n="finalScore">Final Score</span>: <span id="finalScore">0</span></p>
                <p style="font-size: 20px; margin: 10px 0;"><span data-i18n="finalAccuracy">Accuracy</span>: <span id="finalAccuracy">0%</span></p>
                <p style="font-size: 20px; margin: 10px 0;"><span data-i18n="bestCombo">Best Combo</span>: <span id="bestCombo">0</span></p>
                <p style="font-size: 18px; margin: 10px 0; color: #4ecdc4;"><span data-i18n="targetsHit">Targets Hit</span>: <span id="targetsHit">0</span></p>
            </div>
            <button onclick="restartGame()" data-i18n="replayButton">Play Again</button>
            <button onclick="window.parent.postMessage({type: 'CLOSE_AIM_TRAINER'}, '*')" data-i18n="closeButton">Close</button>
        </div>
    </div>

    <script>
        // Translation storage
        let translations = {
            score: 'Score',
            accuracy: 'Accuracy',
            time: 'Time',
            combo: 'Combo',
            startTitle: '🎯 Aim Trainer',
            startDescription: 'Click on the targets that appear to improve your accuracy!',
            startDescription2: 'You have 30 seconds to get the best possible score.',
            startButton: 'Start',
            endTitle: '🏆 Finished!',
            finalScore: 'Final Score',
            finalAccuracy: 'Accuracy',
            bestCombo: 'Best Combo',
            targetsHit: 'Targets Hit',
            replayButton: 'Play Again',
            closeButton: 'Close',
            missEffect: 'Miss!',
            seconds: 's'
        };

        let gameState = {
            isPlaying: false,
            score: 0,
            shots: 0,
            hits: 0,
            timeLeft: 30,
            combo: 0,
            bestCombo: 0,
            targets: [],
            gameTimer: null,
            spawnTimer: null
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Listen for translation messages from parent
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'UPDATE_TRANSLATIONS') {
                console.log('Aim Trainer: Received translations', event.data.translations);
                translations = { ...translations, ...event.data.translations };
                updateTranslations();

                // Acknowledge receipt
                window.parent.postMessage({
                    type: 'TRANSLATIONS_RECEIVED',
                    source: 'aimTrainer'
                }, '*');
            }
        });

        // Update all translatable elements
        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[key]) {
                    element.textContent = translations[key];
                }
            });
            console.log('Aim Trainer: Translations updated');
        }

        // Notify parent that iframe is ready
        window.addEventListener('load', () => {
            console.log('Aim Trainer: Iframe loaded, requesting translations');
            window.parent.postMessage({
                type: 'IFRAME_READY',
                source: 'aimTrainer'
            }, '*');
        });

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameState.isPlaying = true;
            gameState.score = 0;
            gameState.shots = 0;
            gameState.hits = 0;
            gameState.timeLeft = 30;
            gameState.combo = 0;
            gameState.bestCombo = 0;
            gameState.targets = [];

            updateUI();

            // Notify parent that game started
            window.parent.postMessage({
                source: 'aimTrainer',
                type: 'gameStarted'
            }, '*');

            // Start game timer
            gameState.gameTimer = setInterval(() => {
                gameState.timeLeft--;
                updateUI();

                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Start spawning targets
            spawnTarget();
            gameState.spawnTimer = setInterval(spawnTarget, 1000);
        }

        function endGame() {
            gameState.isPlaying = false;
            clearInterval(gameState.gameTimer);
            clearInterval(gameState.spawnTimer);

            // Clear all targets
            gameState.targets.forEach(target => {
                if (target.element) {
                    target.element.remove();
                }
            });
            gameState.targets = [];

            // Show end screen
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('finalAccuracy').textContent =
                gameState.shots > 0 ? Math.round((gameState.hits / gameState.shots) * 100) + '%' : '100%';
            document.getElementById('bestCombo').textContent = gameState.bestCombo;
            document.getElementById('targetsHit').textContent = gameState.hits;
            document.getElementById('endScreen').style.display = 'flex';

            // Send stats to parent window
            const stats = {
                score: gameState.score,
                accuracy: gameState.shots > 0 ? (gameState.hits / gameState.shots) * 100 : 100,
                targetsHit: gameState.hits,
                bestCombo: gameState.bestCombo
            };

            window.parent.postMessage({
                source: 'aimTrainer',
                type: 'gameEnded',
                stats: stats
            }, '*');
        }

        function restartGame() {
            document.getElementById('endScreen').style.display = 'none';
            startGame();
        }

        function spawnTarget() {
            if (!gameState.isPlaying) return;

            const container = document.getElementById('gameContainer');
            const target = document.createElement('div');
            target.className = 'target';

            const size = Math.random() * 40 + 30; // 30-70px
            const x = Math.random() * (container.offsetWidth - size - 40) + 20;
            const y = Math.random() * (container.offsetHeight - size - 40) + 20;

            target.style.width = size + 'px';
            target.style.height = size + 'px';
            target.style.left = x + 'px';
            target.style.top = y + 'px';

            const targetData = {
                element: target,
                size: size,
                x: x,
                y: y,
                spawnTime: Date.now()
            };

            target.addEventListener('click', (e) => {
                e.stopPropagation();
                hitTarget(targetData);
            });

            container.appendChild(target);
            gameState.targets.push(targetData);

            // Remove target after 2 seconds if not clicked
            setTimeout(() => {
                if (target.parentNode) {
                    target.remove();
                    const index = gameState.targets.indexOf(targetData);
                    if (index > -1) {
                        gameState.targets.splice(index, 1);
                    }
                }
            }, 2000);
        }

        function hitTarget(targetData) {
            if (!gameState.isPlaying) return;

            gameState.hits++;
            gameState.shots++;
            gameState.combo++;

            // Calculate score based on target size and reaction time
            const reactionTime = Date.now() - targetData.spawnTime;
            const sizeBonus = Math.max(1, (70 - targetData.size) / 10);
            const speedBonus = Math.max(1, (2000 - reactionTime) / 200);
            const comboBonus = Math.min(gameState.combo * 0.1, 2);

            const points = Math.round(10 * sizeBonus * speedBonus * (1 + comboBonus));
            gameState.score += points;

            if (gameState.combo > gameState.bestCombo) {
                gameState.bestCombo = gameState.combo;
            }

            // Show hit effect
            showHitEffect(targetData.x + targetData.size/2, targetData.y + targetData.size/2, '+' + points);

            // Remove target
            targetData.element.remove();
            const index = gameState.targets.indexOf(targetData);
            if (index > -1) {
                gameState.targets.splice(index, 1);
            }

            updateUI();
        }

        function showHitEffect(x, y, text) {
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.textContent = text;
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';

            document.getElementById('gameContainer').appendChild(effect);

            setTimeout(() => {
                effect.remove();
            }, 500);
        }

        function showMissEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'miss-effect';
            effect.textContent = translations.missEffect || 'Miss!';
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';

            document.getElementById('gameContainer').appendChild(effect);

            setTimeout(() => {
                effect.remove();
            }, 500);
        }

        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('accuracy').textContent =
                gameState.shots > 0 ? Math.round((gameState.hits / gameState.shots) * 100) + '%' : '100%';
            document.getElementById('timer').textContent = gameState.timeLeft;
            document.getElementById('combo').textContent = gameState.combo;
        }

        // Handle clicks on empty space (misses)
        document.getElementById('gameContainer').addEventListener('click', (e) => {
            if (!gameState.isPlaying) return;

            // Only count as miss if clicking on the container itself, not on targets
            if (e.target.id === 'gameContainer' || e.target.id === 'gameCanvas') {
                gameState.shots++;
                gameState.combo = 0;
                showMissEffect(e.clientX, e.clientY);
                updateUI();
            }
        });

        // Prevent context menu
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
